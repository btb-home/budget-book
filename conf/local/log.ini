[formatters]
keys=logformatter

[formatter_logformatter]
format=[%(asctime)s] [%(levelname)s] [%(thread)5d] [%(name)16s] - %(message)s - (%(funcName)s::%(filename)s:%(lineno)d)

[handlers]
keys=logfile, logconsole

[handler_logfile]
class=app.common.logging.log_handler.SafeRotatingFileHandler
level=DEBUG
args=('D://projects/btb-home/budget-book/logs/', 'midnight')
formatter=logformatter 

[handler_logconsole]
class=handlers.logging.StreamHandler
level=INFO
args=()
formatter=logformatter

[loggers]
keys=root

[logger_root]
level=DEBUG
handlers=logfile,logconsole